name: Release

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # For creating releases
  id-token: write # For npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure NPM
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate release tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Release tag must match the package.json version");
          }
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = `## ${version}`;
          const sections = changelog.split(/^## /m);
          const section = sections.find((entry) => entry.split("\n")[0] === version);
          const notes = section?.slice(version.length).trim();
          if (!notes) throw new Error(`Missing changelog notes for ${heading}`);
          fs.writeFileSync("release-notes.md", notes + "\n");
          NODE

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if npm view "@internet-privacy/marmot-ts@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
            echo "Version ${RELEASE_TAG#v} is already on npm; skipping publish"
          else
            pnpm release
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping creation"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --latest --notes-file release-notes.md
          fi

      - name: Publish Nostr notification
        continue-on-error: true
        env:
          NOSTR_KEY: ${{ secrets.NOSTR_KEY }}
        run: |
          # Install nak CLI
          sudo curl -L https://github.com/fiatjaf/nak/releases/latest/download/nak-linux-amd64 -o /usr/local/bin/nak
          sudo chmod +x /usr/local/bin/nak
          # Publish Nostr notification
          chmod +x scripts/publish-nostr.sh
          ./scripts/publish-nostr.sh
